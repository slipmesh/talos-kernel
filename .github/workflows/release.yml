# Triggered by a `vX.Y.Z[+talosA.B.C]` tag - like ../bird, the release tag *is* the published
# image tag (`+` swapped for `-`; see cliff.toml's tag_pattern and the Makefile's
# RELEASE_TAG_SAFE). Runs `make check-pins` (fast, fails loudly if UPSTREAM_PKGS_REF drifted from
# what TALOS_VERSION actually pins) then `make kernel`, which builds and pushes both the signed
# kernel and amneziawg-pkg images.
#
# Each arch builds and pushes to its own -amd64/-arm64 tag on its own native runner
# (ubuntu-24.04-arm for arm64, free for public repos), then a `merge` job combines both into the
# final untagged-arch manifest `docker buildx imagetools create` reads back from the registry.
# A single `--platform linux/amd64,linux/arm64` build used to do both in one job, but the arm64
# half running under QEMU emulation blows past GitHub Actions' 6h job timeout without finishing -
# see the Makefile's own comment on `merge`. Router/nftables/awg-extension hit the same QEMU cost in
# their own bldr step (lighter, never actually timed out) and got the same native-runner
# treatment for consistency and speed.
#
# This is still a real kernel compile, not a small C/Rust build like bird/cni-config's own
# release.yml - `make preflight` wants >=40G free and the standard runner's default disk is well
# short of that, hence the disk-reclaim step below.
name: Release kernel + amneziawg-pkg

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # Reclaims disk by removing preinstalled toolchains this build never uses (Android SDK,
      # .NET, GHC, unused Docker images) - a full kernel build needs more headroom than the
      # runner's default ~14G free.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          docker-images: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify UPSTREAM_PKGS_REF still matches TALOS_VERSION
        run: make check-pins

      - name: Build and push kernel + amneziawg-pkg (this arch)
        run: make kernel TARGET_ARCH=${{ matrix.arch }} RELEASE_TAG=${{ github.ref_name }}

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Combine both arches into the final multi-arch manifest
        run: make merge RELEASE_TAG=${{ github.ref_name }}
