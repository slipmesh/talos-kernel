# A kernel build needs >=40G free (`make preflight`), more than the runner's default disk, hence
# the disk reclaim. Each arch builds on its own native runner: under QEMU the arm64 half outlasts
# the 6h job limit.
name: Release kernel + amneziawg-pkg

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # Reclaims disk by removing preinstalled toolchains this build never uses (Android SDK,
      # .NET, GHC, unused Docker images) - a full kernel build needs more headroom than the
      # runner's default ~14G free.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          docker-images: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify PKGS still matches TALOS_VERSION
        run: make check-pins

      - name: Build and push kernel + amneziawg-pkg (this arch)
        run: make kernel TARGET_ARCH=${{ matrix.arch }} RELEASE_TAG=${{ github.ref_name }}

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Combine both arches into the final multi-arch manifest
        run: make merge RELEASE_TAG=${{ github.ref_name }}
