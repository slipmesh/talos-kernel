# Pull requests and pushes check the pins; only a merged release PR is built, in its own run, and
# released. That build makes the kernel and amneziawg-pkg for both arches, each on a runner of its
# own arch: under QEMU the arm64 half outlasts the 6h job limit. Both images are pushed as
# `sha-<commit>` for the release to retag.
name: CI

on:
  push:
    branches: [main, "release-*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: make check-pins

  release-commit:
    if: github.event_name == 'push'
    uses: slipmesh/.github/.github/workflows/release-commit.yml@v2

  build:
    needs: [pins, release-commit]
    if: needs.release-commit.outputs.version != ''
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7

      # A kernel build needs about 40G free, more than a runner has.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the kernel and amneziawg-pkg
        run: make kernel TARGET_ARCH=${{ matrix.arch }} TAG=sha-${{ github.sha }}

  manifest:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Combine both arches
        run: make manifest TAG=sha-${{ github.sha }}

  tag:
    needs: [release-commit, manifest]
    uses: slipmesh/.github/.github/workflows/tag-release.yml@v2
    permissions:
      contents: write
    with:
      version: ${{ needs.release-commit.outputs.version }}

  promote-kernel:
    needs: [release-commit, tag]
    uses: slipmesh/.github/.github/workflows/promote.yml@v2
    permissions:
      contents: read
      packages: write
    with:
      image: ghcr.io/slipmesh/kernel
      tag: ${{ needs.release-commit.outputs.version }}

  promote-amneziawg-pkg:
    needs: [release-commit, tag]
    uses: slipmesh/.github/.github/workflows/promote.yml@v2
    permissions:
      contents: read
      packages: write
    with:
      image: ghcr.io/slipmesh/amneziawg-pkg
      tag: ${{ needs.release-commit.outputs.version }}

  release:
    needs: [release-commit, promote-kernel, promote-amneziawg-pkg]
    uses: slipmesh/.github/.github/workflows/release.yml@v2
    permissions:
      contents: write
    with:
      tag: ${{ needs.release-commit.outputs.version }}
      prerelease: ${{ needs.release-commit.outputs.prerelease == 'true' }}
